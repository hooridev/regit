name: Publish SNAPSHOT

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-snapshot
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # LogTest compares against native git log on this repo's full history

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_TOKEN

      - name: Ensure version is a SNAPSHOT
        run: |
          version=$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)
          echo "Version: $version"
          [[ "$version" == *-SNAPSHOT ]] || { echo "::error::Not a SNAPSHOT version: $version"; exit 1; }

      # No -Prelease: Central does not require signatures for SNAPSHOTs, so GPG stays off.
      - name: Deploy to Maven Central snapshots
        run: mvn -B deploy
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
